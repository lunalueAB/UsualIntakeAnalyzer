/* ════════════════ BASE UI ════════════════ */
function Btn({children,variant='primary',onClick,disabled,style,small}){
  const base={border:'none',borderRadius:4,cursor:disabled?'not-allowed':'pointer',
    fontFamily:'inherit',fontWeight:600,fontSize:small?11:13,
    padding:small?'4px 10px':'7px 16px',transition:'all .15s',display:'inline-flex',
    alignItems:'center',gap:4,opacity:disabled?.5:1};
  const v={
    primary:{background:'#2563EB',color:'#fff'},
    secondary:{background:'#fff',color:'#1E293B',border:'1px solid #CBD5E1'},
    ghost:{background:'transparent',color:'#475569'},
    danger:{background:'#DC2626',color:'#fff'},
    success:{background:'#16A34A',color:'#fff'},
  };
  return <button style={{...base,...v[variant],...style}} onClick={!disabled?onClick:undefined}>{children}</button>;
}

function Input({value,onChange,placeholder,style}){
  return <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
    style={{border:'1px solid #CBD5E1',borderRadius:4,padding:'7px 10px',width:'100%',
      background:'#fff',color:'#1E293B',...style}}/>;
}

function Select({value,onChange,children,style}){
  return <select value={value} onChange={e=>onChange(e.target.value)}
    style={{border:'1px solid #CBD5E1',borderRadius:4,padding:'6px 10px',width:'100%',
      background:'#fff',color:'#1E293B',cursor:'pointer',...style}}>
    {children}

}

/* ════════════════ CHARTS ════════════════ */
function DensityChart(){
  const W=520,H=220,pl=44,pr=16,pt=28,pb=36;
  const w=W-pl-pr, h=H-pt-pb;
  function logNorm(x,mu,sig){
    if(x<=0)return 0;
    const z=(Math.log(x)-mu)/sig;
    return Math.exp(-z*z/2)/(x*sig*Math.sqrt(2*Math.PI));
  }
  const maxX=900;
  const curves=[
    {name:'전체',mu:4.8,sig:1.1,color:'#2563EB',dash:''},
    {name:'남자',mu:5.0,sig:1.05,color:'#F97316',dash:''},
    {name:'여자',mu:4.7,sig:1.15,color:'#EC4899',dash:''},
    {name:'1일 실측치',mu:5.1,sig:1.3,color:'#94A3B8',dash:'5,4'},
  ];
  const N=120;
  let maxY=0;
  curves.forEach(c=>{for(let i=1;i<=N;i++){const y=logNorm(i/N*maxX,c.mu,c.sig);if(y>maxY)maxY=y;}});
  function path(c){
    const pts=[];
    for(let i=0;i<=N;i++){
      const x=i/N*maxX;
      const y=logNorm(x,c.mu,c.sig);
      const px=pl+(x/maxX)*w;
      const py=pt+h-(y/maxY)*h;
      pts.push(`${i===0?'M':'L'}${px.toFixed(1)},${py.toFixed(1)}`);
    }
    return pts.join(' ');
  }
  const xTicks=[0,200,400,600,800];
  return <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}>
    <line x1={pl} y1={pt} x2={pl} y2={pt+h} stroke="#E2E8F0" strokeWidth="1"/>
    <line x1={pl} y1={pt+h} x2={pl+w} y2={pt+h} stroke="#E2E8F0" strokeWidth="1"/>
    {[.25,.5,.75,1].map(t=><line key={t} x1={pl} y1={pt+h*(1-t)} x2={pl+w} y2={pt+h*(1-t)} stroke="#F1F5F9" strokeWidth="1"/>)}
    {curves.map(c=><path key={c.name} d={path(c)} fill="none" stroke={c.color} strokeWidth="2" strokeDasharray={c.dash}/>)}
    {xTicks.map(v=><text key={v} x={pl+(v/maxX)*w} y={pt+h+14} textAnchor="middle" fontSize="10" fill="#94A3B8">{v}</text>)}
    <text x={pl-6} y={pt+h} textAnchor="end" fontSize="10" fill="#94A3B8">0</text>
    {curves.map((c,i)=><g key={c.name} transform={`translate(${pl+i*120},${pt+4})`}>
      <line x1="0" y1="5" x2="16" y2="5" stroke={c.color} strokeWidth="2" strokeDasharray={c.dash}/>
      <text x="20" y="9" fontSize="10" fill="#475569">{c.name}</text>
    </g>)}
    <text x="8" y={pt+h/2} textAnchor="middle" fontSize="10" fill="#94A3B8"
      transform={`rotate(-90,8,${pt+h/2})`}>밀도</text>
    <text x={pl+w/2} y={H-4} textAnchor="middle" fontSize="10" fill="#94A3B8">섭취량 (g/day)</text>
  </svg>;
}

function QuantileChart(){
  const W=520,H=300,pl=52,pr=16,pt=20,pb=50;
  const w=W-pl-pr, h=H-pt-pb;
  const ages=['19-29','30-49','50-64','65+'];
  const male=[512.1,501.4,475.6,428.3];
  const female=[441.2,428.5,415.3,389.4];
  const maxV=580;
  const barW=24, gap=8, groupW=barW*2+gap, spacing=w/ages.length;
  return <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}>
    <line x1={pl} y1={pt} x2={pl} y2={pt+h} stroke="#E2E8F0" strokeWidth="1"/>
    <line x1={pl} y1={pt+h} x2={pl+w} y2={pt+h} stroke="#E2E8F0" strokeWidth="1"/>
    {[.25,.5,.75,1].map(t=><line key={t} x1={pl} y1={pt+h*(1-t)} x2={pl+w} y2={pt+h*(1-t)} stroke="#F1F5F9" strokeWidth="1"/>)}
    {[.25,.5,.75,1].map(t=><text key={t} x={pl-4} y={pt+h*(1-t)+4} textAnchor="end" fontSize="10" fill="#94A3B8">{Math.round(t*maxV)}</text>)}
    {ages.map((age,i)=>{
      const cx=pl+spacing*(i+.5);
      const mh=(male[i]/maxV)*h;
      const fh=(female[i]/maxV)*h;
      return <g key={age}>
        <rect x={cx-groupW/2} y={pt+h-mh} width={barW} height={mh} fill="#3B82F6" opacity=".8" rx="2"/>
        <rect x={cx-groupW/2+barW+gap} y={pt+h-fh} width={barW} height={fh} fill="#F472B6" opacity=".8" rx="2"/>
        <text x={cx} y={pt+h+14} textAnchor="middle" fontSize="11" fill="#475569">{age}</text>
        <text x={cx-groupW/2+barW/2} y={pt+h-mh-4} textAnchor="middle" fontSize="9" fill="#2563EB">{male[i]}</text>
        <text x={cx-groupW/2+barW+gap+barW/2} y={pt+h-fh-4} textAnchor="middle" fontSize="9" fill="#DB2777">{female[i]}</text>
      </g>;
    })}
    <g transform={`translate(${pl+20},${H-12})`}>
      <rect width="12" height="10" fill="#3B82F6" opacity=".8" rx="2"/>
      <text x="16" y="9" fontSize="11" fill="#475569">남자 P95</text>
      <rect x="70" width="12" height="10" fill="#F472B6" opacity=".8" rx="2"/>
      <text x="86" y="9" fontSize="11" fill="#475569">여자 P95</text>
    </g>
    <text x="8" y={pt+h/2} textAnchor="middle" fontSize="10" fill="#94A3B8"
      transform={`rotate(-90,8,${pt+h/2})`}>섭취량 (g/day)</text>
  </svg>;
}

function SourceManageModal({onClose}){
  const [open,setOpen]=useState({p1:true,ph1:true,ph2:true,p2:true,ph3:true});
  const toggle=id=>setOpen(o=>({...o,[id]:!o[id]}));
  return <Modal title="자료원 관리" subtitle="대분류(사업) → 기수 → 차수 추가/편집/삭제" onClose={onClose} width={500}>
    <div style={{display:'flex',gap:8,marginTop:16,marginBottom:12}}>
      <Btn variant="secondary" small>＋ 사업</Btn>
      <Btn variant="secondary" small>＋ 기수</Btn>
      <Btn variant="secondary" small>＋ 차수</Btn>
    </div>
    <div style={{border:'1px solid #CBD5E1',borderRadius:6,background:'#F8FAFC',
      minHeight:280,maxHeight:320,overflow:'auto',padding:'8px 0'}}>
      {PROJECTS.map(p=><div key={p.id}>
        <div onClick={()=>toggle(p.id)} style={{padding:'6px 14px',cursor:'pointer',
          display:'flex',alignItems:'center',gap:6,fontWeight:600,fontSize:13}}>
          <span>{open[p.id]?'▼':'▶'}</span>📁 {p.name} <span style={{color:'#94A3B8',fontWeight:400,fontSize:11}}>({p.code})</span>

              <th style={{width:90}}>등록일</th>

            <tbody>

  return <div style={{flex:1,overflow:'auto',padding:'20px'}}>
    {/* Meta card */}
    <div style={{border:'1px solid #E2E8F0',borderRadius:8,background:'#fff',
      padding:'16px 20px',marginBottom:14,display:'flex',gap:32,alignItems:'center'}}>
      <div style={{flex:1}}>
        <div style={{fontSize:11,fontWeight:600,color:'#94A3B8'}}>식품군</div>
        <div style={{fontSize:20,fontWeight:700}}>{scenario.group}</div>
        <div style={{fontSize:11,color:'#94A3B8',marginTop:2}}>시뮬레이션 {scenario.simTime}회 · 분석자: {scenario.byWho}</div>
      </div>
      {[['분석 대상 (N)',N.toLocaleString(),'#2563EB'],['rhoP',rhoP.toFixed(3),'#16A34A'],['rhoA',rhoA.toFixed(3),'#16A34A'],['papa (1일만)',papa.toFixed(3),'#D97706']].map(([l,v,c])=>
        <div key={l} style={{textAlign:'right'}}>
          <div style={{fontSize:10,fontWeight:600,color:'#94A3B8'}}>{l}</div>
          <div style={{fontSize:22,fontWeight:700,color:c,marginTop:2}}>{v}</div>
        </div>
      )}
    </div>
    {/* Stat cards */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10,marginBottom:14}}>
      {statCards.map(s=><div key={s.label} style={{border:'1px solid #E2E8F0',borderRadius:8,
        background:'#fff',padding:'12px 14px'}}>
        <div style={{fontSize:10,fontWeight:600,color:'#94A3B8'}}>{s.label}</div>
        <div style={{fontSize:22,fontWeight:700,color:s.color,marginTop:4}}>{s.val}</div>
      </div>)}
    </div>
    {/* Charts */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}}>
      <div style={{border:'1px solid #E2E8F0',borderRadius:8,background:'#fff',padding:'14px'}}>
        <div style={{fontWeight:600,marginBottom:10,fontSize:13}}>일상섭취량 분포 (전체·남자·여자·1일 실측치)</div>
        <DensityChart/>
      </div>
      <div style={{border:'1px solid #E2E8F0',borderRadius:8,background:'#fff',padding:'14px'}}>
        <div style={{fontWeight:600,marginBottom:10,fontSize:13}}>성별·연령군 분위수 도표</div>
        <QuantileChart/>
      </div>
    </div>
    {/* Result table */}
    <div style={{border:'1px solid #E2E8F0',borderRadius:8,background:'#fff',overflow:'hidden'}}>
      <div style={{padding:'10px 14px',borderBottom:'1px solid #E2E8F0',fontWeight:600,fontSize:13}}>
        성별·연령군 통계 결과
      </div>
      <div style={{overflow:'auto',maxHeight:280}}>
        <table>
          <thead><tr>
            <th>성별</th><th>연령군</th><th style={{textAlign:'right'}}>N</th>
            <th style={{textAlign:'right'}}>평균</th><th style={{textAlign:'right'}}>SD</th>
            <th style={{textAlign:'right'}}>최솟값</th><th style={{textAlign:'right'}}>P95</th>
            <th style={{textAlign:'right'}}>P97.5</th><th style={{textAlign:'right'}}>P99</th>
            <th style={{textAlign:'right'}}>최댓값</th>
          </tr></thead>
          <tbody>
            {RESULT_ROWS.map((r,i)=><tr key={i} style={r.ageG==='전체'?{fontWeight:600}:{}}>
              <td>{r.sex}</td><td>{r.ageG}</td>
              <td style={{textAlign:'right'}}>{r.N.toLocaleString()}</td>
              <td style={{textAlign:'right'}}>{r.avg.toFixed(2)}</td>
              <td style={{textAlign:'right'}}>{r.sd.toFixed(2)}</td>
              <td style={{textAlign:'right'}}>{r.min.toFixed(2)}</td>
              <td style={{textAlign:'right',color:'#D97706'}}>{r.p95.toFixed(2)}</td>
              <td style={{textAlign:'right'}}>{r.p975.toFixed(2)}</td>
              <td style={{textAlign:'right',color:'#DC2626'}}>{r.p99.toFixed(2)}</td>
              <td style={{textAlign:'right'}}>{r.max.toFixed(2)}</td>
            </tr>)}
          </tbody>
        </table>
      </div>
    </div>
  </div>;
}

function AnalysisTab({openFoodGroup}){
  const [sideOpen,setSideOpen]=useState(false);
  const [scenario,setScenario]=useState(null);
  const [showHistory,setShowHistory]=useState(false);

  return <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
    {/* Toolbar */}
    <div style={{padding:'10px 20px',borderBottom:'1px solid #E2E8F0',background:'#fff',
      display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        <Btn onClick={()=>{setSideOpen(true);}}>＋ 시나리오 분석</Btn>
        <div style={{width:1,height:24,background:'#E2E8F0',margin:'0 4px'}}/>
        <Btn variant="ghost" onClick={()=>setShowHistory(true)}>↻ 분석 이력</Btn>
        <Btn variant="ghost" disabled={!scenario}>💾 결과 내보내기</Btn>
      </div>
      {scenario&&<div style={{background:'#DBEAFE',border:'1px solid #BFDBFE',borderRadius:4,
        padding:'5px 12px',fontSize:11,color:'#2563EB',fontWeight:600}}>
        현재 시나리오 · {scenario.group}
      </div>}
    </div>

    {/* Summary bar */}
    {scenario&&<div style={{padding:'6px 20px',borderBottom:'1px solid #E2E8F0',
      background:'#F8FAFC',fontSize:11,color:'#64748B',flexShrink:0}}>
      N=8,320 · rhoP=0.423 · rhoA=0.187 · papa=0.612 · 시뮬레이션 {scenario.simTime}회 · 분석자: {scenario.byWho}
    </div>}

    {/* Content */}
    {!scenario
      ? <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:12}}>
          <div style={{fontSize:48}}>📊</div>
          <div style={{fontSize:15,fontWeight:700}}>선택된 시나리오가 없습니다</div>
          <div style={{fontSize:12,color:'#94A3B8',textAlign:'center',maxWidth:480,lineHeight:1.7}}>
            상단에서 <strong>＋ 시나리오 분석</strong>을 눌러 새 분석 조건을 구성하거나,<br/>
            <strong>↻ 분석 이력</strong>에서 기존 시나리오를 선택하세요.
          </div>
        </div>
      : <ResultDashboard scenario={scenario}/>
    }

    {/* Side panel */}
    {sideOpen&&<SidePanel
      onClose={()=>setSideOpen(false)}
      onRun={(s)=>setScenario(s)}
      openFoodGroup={openFoodGroup}/>}

    {/* History modal */}
    {showHistory&&<HistoryModal onClose={()=>setShowHistory(false)}
      onSelect={h=>setScenario({group:h.group,simTime:String(h.simTime),byWho:h.by})}/>}
  </div>;
}

/* ════════════════ METHODOLOGY TAB ════════════════ */
function MethodologyTab(){
  const methods=[
    {badge:'기본 방법',icon:'🎯',title:'NCI',sub:'National Cancer Institute Method',
     desc:'랜덤효과 2부 모형(2-part mixed model)으로 섭취자 비율(P(Y>0|u))과 섭취량 분포(E[Y|Y>0,u])를 분리하여 추정합니다. 개인 내·개인 간 분산 분리를 통해 장기 섭취 분포를 시뮬레이션합니다.',
     cond:['비연속 섭취 식품 (섭취자율 < 95%)', '2일 조사 자료 보유 (x0 필수)', '충분한 표본 크기 (N ≥ 300)'],
     color:'#2563EB'},
    {badge:'보완 방법 A',icon:'📐',title:'ISU',sub:'Iowa State University Method',
     desc:'Box-Cox 변환을 적용한 ANOVA 기반 방법입니다. 식품 섭취가 비교적 연속적이고 정규 분포에 가까울 때 적용합니다. 변환-역변환 절차로 원래 척도의 분포를 복원합니다.',
     cond:['준연속 섭취 (섭취자율 95-100%)', '중등도 편포 자료', '빠른 계산이 필요한 경우'],
     color:'#7C3AED'},
    {badge:'보완 방법 B',icon:'📊',title:'MSM',sub:'Multiple Source Method',
     desc:'베이즈 추론 기반의 방법으로, 개인 수준 일상섭취량 최적 예측값(BLUP)을 산출합니다. 특히 집단 내 이질성이 클 때 개인별 추정의 정확도가 높습니다.',
     cond:['개인별 BLUP 산출이 필요한 경우', '연령·성별 층화 분석', '영양 모델링 연계 분석'],
     color:'#0891B2'},
  ];
  return <div style={{flex:1,overflow:'auto',padding:'0 0 40px'}}>
    <div style={{maxWidth:1000,margin:'0 auto',padding:'32px 40px'}}>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:26,fontWeight:700,marginBottom:6}}>산출 방법론</div>
        <div style={{fontSize:13,color:'#64748B'}}>일상섭취량(usual intake) 추정에 사용되는 통계 방법 소개</div>
      </div>
      <div style={{borderLeft:'3px solid #2563EB',padding:'14px 18px',background:'#fff',
        borderRadius:'0 6px 6px 0',marginBottom:28,lineHeight:1.8,fontSize:12,color:'#1E293B'}}>
        <strong>일상섭취량(Usual Intake)</strong>은 1~2일치 식이조사 자료에서 개인의 평소(장기 평균) 섭취 분포를 추정하는 개념입니다.
        본 프로그램은 미국 NCI 방법을 기본으로 하며, 자료의 특성에 따라 ISU 또는 MSM 방법을 보완 적용합니다.
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:18,marginBottom:28}}>
        {methods.map(m=><div key={m.title} style={{border:'1px solid #E2E8F0',borderRadius:8,
          background:'#fff',padding:'20px',display:'flex',flexDirection:'column',gap:10}}>
          <Badge color={m.title==='NCI'?'blue':m.title==='ISU'?'gray':'gray'}>{m.badge}</Badge>
          <div style={{fontSize:32}}>{m.icon}</div>
          <div>
            <div style={{fontSize:20,fontWeight:700,color:m.color}}>{m.title}</div>
            <div style={{fontSize:11,color:'#94A3B8',marginTop:2}}>{m.sub}</div>
          </div>
          <div style={{fontSize:12,color:'#475569',lineHeight:1.7,flex:1}}>{m.desc}</div>
          <div style={{borderTop:'1px solid #E2E8F0',paddingTop:10}}>
            <div style={{fontSize:11,fontWeight:600,color:'#64748B',marginBottom:6}}>적용 조건</div>
            {m.cond.map(c=><div key={c} style={{fontSize:11,color:'#475569',display:'flex',gap:6,marginBottom:3}}>
              <span style={{color:m.color}}>✓</span>{c}
            </div>)}
          </div>
          <Btn variant="secondary" small>상세 보기</Btn>
        </div>)}
      </div>
      <div style={{background:'#fff',border:'1px solid #E2E8F0',borderRadius:8,padding:'20px'}}>
        <div style={{fontSize:14,fontWeight:700,marginBottom:12}}>방법 자동 선택 기준</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,fontSize:12}}>
          {[['섭취자율 < 95%','NCI','#2563EB'],['섭취자율 95~100%','ISU','#7C3AED'],['BLUP 필요 시','MSM','#0891B2']].map(([cond,method,color])=>
            <div key={method} style={{background:'#F8FAFC',borderRadius:6,padding:'12px',border:`1px solid ${color}20`}}>
              <div style={{color:'#64748B',marginBottom:4}}>{cond}</div>
              <div style={{fontSize:16,fontWeight:700,color}}>{method}</div>
            </div>
          )}
        </div>
      </div>
    </div>
  </div>;
}

/* ════════════════ APP ════════════════ */
function App(){
  const [tab,setTab]=useState('db');
  const [modal,setModal]=useState(null);

  const openModal=useCallback(m=>setModal(m),[]);
  const closeModal=useCallback(()=>setModal(null),[]);

  return <div style={{height:'100vh',display:'flex',flexDirection:'column',background:'#F8FAFC'}}>
    {/* Header */}
    <div style={{background:'#1E293B',color:'#fff',padding:'10px 24px',
      display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:20}}>📊</span>
        <div>
          <div style={{fontSize:14,fontWeight:700,letterSpacing:.2}}>일상섭취량 분석 프로그램</div>
          <div style={{fontSize:10,color:'#94A3B8'}}>Usual Intake Analyzer</div>
        </div>
      </div>
      <Badge color="gray">v2.4.1</Badge>
    </div>

    {/* Tab bar */}
    <div style={{background:'#fff',borderBottom:'2px solid #E2E8F0',
      padding:'0 24px',display:'flex',alignItems:'stretch',flexShrink:0}}>
      {[['db','DB 조회/관리'],['analysis','일상섭취량 분석'],['methodology','산출 방법론']].map(([v,l])=>
        <button key={v} onClick={()=>setTab(v)}
          style={{padding:'12px 20px',fontSize:13,fontWeight:tab===v?700:400,
            background:'none',border:'none',cursor:'pointer',
            color:tab===v?'#2563EB':'#475569',
            borderBottom:tab===v?'2px solid #2563EB':'2px solid transparent',
            marginBottom:-2,transition:'all .15s'}}>
          {l}
        </button>
      )}
    </div>

    {/* Content */}
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {tab==='db'&&<DbManagementTab openUpload={()=>openModal('upload')} openSourceManage={()=>openModal('source')}/>}
      {tab==='analysis'&&<AnalysisTab openFoodGroup={()=>openModal('foodgroup')}/>}
      {tab==='methodology'&&<MethodologyTab/>}
    </div>

    {/* Modals */}
    {modal==='upload'&&<UploadModal onClose={closeModal}/>}
    {modal==='source'&&<SourceManageModal onClose={closeModal}/>}
    {modal==='foodgroup'&&<FoodGroupModal onClose={closeModal}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
